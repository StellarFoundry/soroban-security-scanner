[workspace]
resolver = "2"
members = [
    "crates/soroban-scan-core",
    "crates/soroban-scan-cli",
    "xtask",
]
exclude = [
    "examples/*",
    "fixtures/*",
    "fuzz",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["AyinkxLab <olayinkaawal00@gmail.com>"]
repository = "https://github.com/AyinkxLab/soroban-security-scanner"
homepage = "https://github.com/AyinkxLab/soroban-security-scanner"
description = "Deterministic security analysis for Stellar Soroban smart contracts and Rust projects."
readme = "README.md"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Rust source parsing (deterministic, no code execution)
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Opt-in AI provider transport (never enabled by default)
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Filesystem traversal
walkdir = "2"

# Path matching for excludes
globset = "0.4"

# Fingerprints / hashing for baselines
sha2 = "0.11"
hex = "0.4"

# Internal crates
soroban-scan-core = { path = "crates/soroban-scan-core", version = "0.2.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1
