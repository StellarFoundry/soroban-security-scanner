name: PR Security Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-files:
    name: Scan changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build scanner
        run: cargo build --release -p soroban-scan-cli

      - name: Determine changed Rust files
        id: changed
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${GITHUB_BASE_REF}" || true
          # The repository's own fixtures and examples are intentionally
          # vulnerable test data, not production code: exclude them so they do
          # not raise code-scanning alerts for every detector change.
          #
          # `--diff-filter=ACMR` drops deletions while keeping added, copied,
          # modified, and renamed-to paths (rename detection is `-M`). A rename
          # therefore contributes its destination path only. The loop then
          # verifies each remaining path exists as a regular file (not a
          # submodule/symlink) and ends in `.rs` before scanning, so a stale or
          # missing path can never produce a false "clean" result (#165).
          git diff -M --name-only --diff-filter=ACMR -z "${base}...HEAD" -- '*.rs' \
            | while IFS= read -r -d '' path; do
                if [ ! -f "$path" ] || [ -L "$path" ]; then
                  continue
                fi
                # Submodules are index entries with mode 160000; never scan them.
                if git ls-files -s -- "$path" | grep -q '^160000 '; then
                  continue
                fi
                case "$path" in
                  *.rs) printf '%s\n' "$path" ;;
                esac
              done \
            | sed '/^$/d' \
            | grep -v -E '^(fixtures|examples)/' \
            > changed.txt || true
          count=$(wc -l < changed.txt | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Scan changed files
        if: steps.changed.outputs.count != '0'
        run: |
          ./target/release/soroban-scan scan . \
            --files-from changed.txt \
            --exclude 'fixtures/**' \
            --exclude 'examples/**' \
            --format json \
            --output results.json \
            --fail-on none

      - name: Annotate high and critical findings
        if: steps.changed.outputs.count != '0'
        run: |
          ./target/release/soroban-scan scan . \
            --files-from changed.txt \
            --exclude 'fixtures/**' \
            --exclude 'examples/**' \
            --format github \
            --min-severity high \
            --fail-on none

      - name: Produce SARIF
        if: steps.changed.outputs.count != '0'
        run: |
          ./target/release/soroban-scan scan . \
            --files-from changed.txt \
            --exclude 'fixtures/**' \
            --exclude 'examples/**' \
            --format sarif \
            --output results.sarif \
            --fail-on none

      # SARIF upload requires permissions that fork PRs do not have.
      - name: Upload SARIF to code scanning
        if: steps.changed.outputs.count != '0' && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: soroban-scan-pr

      # Opt-in PR comment. Enable by setting the repository variable
      # SOROBAN_SCAN_PR_COMMENT to "true". Never runs for forks.
      #
      # The body is generated locally, then pr_comment.py updates a single
      # "sticky" comment identified by a hidden marker. Re-runs on later pushes
      # therefore edit the existing comment instead of adding another one.
      - name: Comment summary on PR
        if: steps.changed.outputs.count != '0' && vars.SOROBAN_SCAN_PR_COMMENT == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          total=$(jq '.findings | length' results.json)
          {
            echo "### Soroban Security Scan"
            echo ""
            echo "Changed Rust files scanned: $(cat changed.txt | wc -l | tr -d ' ')"
            echo ""
            echo "Findings: ${total}"
            echo ""
            jq -r '.findings[] | "- `\(.rule_id)` **\(.severity)** `\(.location.file):\(.location.line)` — \(.title)"' results.json | head -50
            echo ""
            echo "_Updated automatically on every push. See [GitHub Integration](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/github-integration.md#opt-in-pr-comments)._"
          } > comment.md
          python3 .github/scripts/pr_comment.py \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${{ github.event.pull_request.number }}" \
            --body-file comment.md

      # Opt-in structured check run with inline annotations. Enable by setting
      # the repository variable SOROBAN_SCAN_CHECK_RUN to "true". Fork PRs get a
      # read-only token, so they cannot create checks; the guard skips them.
      - name: Create check run with annotations
        if: steps.changed.outputs.count != '0' && vars.SOROBAN_SCAN_CHECK_RUN == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/check_run.py \
            --repo "${GITHUB_REPOSITORY}" \
            --report results.json \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --fail-on "${{ vars.SOROBAN_SCAN_CHECK_RUN_FAIL_ON || 'high' }}"
