name: Baseline Refresh

# Regenerate the repository baseline on a schedule and open a pull request for
# review. Never pushes to main and never auto-merges: baseline changes are
# accepted only after a maintainer reviews the diff.

on:
  schedule:
    # Weekly, Monday 04:17 UTC. The odd minute avoids the top-of-hour rush.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: baseline-refresh
  cancel-in-progress: false

env:
  # Maintainers can point these at their own contract tree and baseline file
  # with repository variables. The defaults scan this repository's real code;
  # intentionally vulnerable fixtures and examples are excluded.
  SCAN_PATH: ${{ vars.SOROBAN_SCAN_BASELINE_SCAN_PATH || '.' }}
  BASELINE_PATH: ${{ vars.SOROBAN_SCAN_BASELINE_FILE || '.soroban-scan-baseline.json' }}

jobs:
  refresh:
    name: Refresh baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build scanner
        run: cargo build --release -p soroban-scan-cli

      - name: Regenerate baseline
        run: |
          ./target/release/soroban-scan scan "${SCAN_PATH}" \
            --exclude 'fixtures/**' \
            --exclude 'examples/**' \
            --write-baseline "${BASELINE_PATH}" \
            --fail-on none \
            --quiet

      - name: Open or update the baseline refresh pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: ${{ env.BASELINE_PATH }}
          branch: automation/baseline-refresh
          delete-branch: true
          commit-message: "chore(baseline): refresh security baseline"
          title: "chore(baseline): refresh security baseline"
          body: |
            Automated refresh of `${{ env.BASELINE_PATH }}` from
            `${{ env.SCAN_PATH }}`.

            This pull request is opened for review only. It is never auto-merged:
            review the baseline diff to confirm that newly accepted findings are
            intentional. Regenerated by `.github/workflows/baseline-refresh.yml`.

            Set `SOROBAN_SCAN_BASELINE_SCAN_PATH` or
            `SOROBAN_SCAN_BASELINE_FILE` repository variables to change the scan
            target or baseline path.
          labels: ci
