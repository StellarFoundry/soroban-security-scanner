name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull-request runs, but let every push to main finish so
  # each merged commit has a complete CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.91.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all --locked
      - run: cargo test --all --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --all --all-features

  test-aarch64:
    name: Test (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --all --all-features

  task-runner:
    name: Task runner (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install just
        run: cargo install just --locked
      # Proves the single documented entry point runs the full local gate.
      - run: just check

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python tools/check_docs.py

  semver:
    name: Semver (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed to find the latest release baseline.
          fetch-depth: 0
      - name: Resolve latest release tag
        id: baseline
        run: |
          tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::No release tag exists yet; skipping semver checks."
          else
            echo "Checking soroban-scan-core against $tag" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check public API of soroban-scan-core
        if: steps.baseline.outputs.tag != ''
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: soroban-scan-core
          baseline-rev: ${{ steps.baseline.outputs.tag }}
          # Pre-1.0: `release-type: minor` relaxes the lints a minor release
          # satisfies. Lints that require a major version still fail the job
          # (see docs/development/release.md). Revisit this once 1.0 ships.
          release-type: minor

  package:
    name: Package (cargo publish --dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # has been published; the release workflow verifies it at publish time.
      - run: cargo publish --dry-run -p soroban-scan-core --locked

  sdk-matrix:
    name: Soroban SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: "20.5.0"
            fixture: fixtures/sdk-matrix/soroban-sdk-20
          - sdk: "21.7.7"
            fixture: fixtures/sdk-matrix/soroban-sdk-21
          - sdk: "29.0.1"
            fixture: fixtures/sdk-matrix/soroban-sdk-29
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build scanner
        run: cargo build --release -p soroban-scan-cli
      - name: Scan the pinned fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          ./target/release/soroban-scan scan "${FIXTURE}" \
            --format json \
            --output "sdk-${{ matrix.sdk }}.json" \
            --fail-on none
          python3 tools/check_sdk_matrix.py \
            "sdk-${{ matrix.sdk }}.json" \
            --sdk "${{ matrix.sdk }}"

  benchmark:
    name: Benchmark regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build scanner
        run: cargo build --release -p soroban-scan-cli
      - name: Compare against the recorded baseline
        run: |
          python3 tools/benchmark.py \
            --runs 5 \
            --baseline tools/benchmark_baseline.json \
            --json-out target/benchmark-stats.json
      - name: Upload benchmark stats
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-stats
          path: target/benchmark-stats.json
          if-no-files-found: ignore

  python:
    name: Python helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install manifest test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Run tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker build and smoke scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --tag soroban-scan:ci .
      - name: Verify the image runs as non-root
        run: |
          test "$(docker run --rm --entrypoint id soroban-scan:ci -u)" = "65532"
          test "$(docker inspect --format '{{.Config.User}}' soroban-scan:ci)" = "65532:65532"
      - name: Verify the documented entry point
        run: docker run --rm soroban-scan:ci version
      - name: Scan a fixture without network access
        run: |
          docker run --rm --network none \
            -v "$PWD/fixtures/corpus/SS-001:/src:ro" \
            soroban-scan:ci scan /src --format json --fail-on none > scan.json
          python3 - <<'PY'
          import json

          with open("scan.json", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["findings"], "fixture should produce at least one finding"
          print(f"scan found {len(report['findings'])} finding(s)")
          PY
      - name: Verify the health check
        run: |
          container="$(docker run -d --name soroban-scan-health \
            --health-interval 1s --health-timeout 5s --health-retries 3 \
            --entrypoint sleep soroban-scan:ci 30)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          status=starting
          for attempt in $(seq 1 20); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [ "$status" = "healthy" ]; then
              echo "container health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "::error::health check did not become healthy (status: $status)"
          docker logs "$container"
          exit 1

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2