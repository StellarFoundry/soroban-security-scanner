[pack]
name = "soroban-conformance-pack"
version = "0.1.0"
description = "Conformance fixture pack with known findings for scanner compatibility testing"
authors = ["Stellar Foundry <security@stellarfoundry.org>"]
min_scanner_version = "0.2.0"

[[rules]]
id = "CONF-001"
title = "Missing authorization in state-mutating entry point"
category = "authorization"
default_severity = "high"
default_confidence = "high"
description = "Verifies that the scanner reports SS-001 on unguarded persistent storage writes."

[[rules]]
id = "CONF-008"
title = "Unchecked arithmetic in entry point"
category = "arithmetic"
default_severity = "high"
default_confidence = "medium"
description = "Verifies that the scanner reports SS-008 on unchecked integer subtraction."
