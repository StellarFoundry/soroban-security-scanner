# Adversarial fixture expectations (#143).
#
# Every built-in detector must have exactly one entry here. The test derives the
# rule list from RuleRegistry, so a new detector without an entry fails.
#
# `expect` is either "trigger" (the rule must report at least one finding for
# this sample) or "no-trigger" (the rule must report nothing). The `why` field
# records the expected behaviour and, for no-trigger cases, the known limit.
# Paths are relative to this directory.

[SS-001]
file = "SS-001/spaced_chain.rs"
expect = "trigger"
why = "Aliased crate and whitespace inside the storage method chain still form a storage write in an entry point with no authorization."

[SS-002]
file = "SS-002/aliased_client.rs"
expect = "trigger"
why = "The client type is imported as Tok, but import canonicalization resolves it back to the Soroban token Client, so the unauthenticated constructor is still reported."

[SS-003]
file = "SS-003/split_iterator.rs"
expect = "trigger"
why = "A storage keys() iterator split across lines is still unbounded storage iteration in an entry point."

[SS-004]
file = "SS-004/spaced_panic.rs"
expect = "trigger"
why = "Whitespace between the panic macro name and its delimiter does not hide the panic-prone construct."

[SS-005]
file = "SS-005/spaced_unsafe.rs"
expect = "trigger"
why = "Spaced core::ptr::read inside an unsafe block is still unsafe code in a contract implementation."

[SS-006]
file = "SS-006/aliased_key_macro.rs"
expect = "trigger"
why = "Aliasing symbol_short as key does not hide the persistent write, and no TTL manager is present."

[SS-007]
file = "SS-007/raw_string_address.rs"
expect = "trigger"
why = "A raw string literal with the Stellar address shape is still a hardcoded address."

[SS-008]
file = "SS-008/split_subtraction.rs"
