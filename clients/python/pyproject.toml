[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soroban-scan-client"
version = "0.1.0"
description = "Typed, dependency-free Python client for the opt-in soroban-scan HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soroban_scan_client = ["py.typed"]
